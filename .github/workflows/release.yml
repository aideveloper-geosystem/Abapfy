name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build-flag: --win
            artifact: windows
          - os: macos-latest
            build-flag: --mac --universal
            artifact: macos
          - os: ubuntu-latest
            build-flag: --linux
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm typecheck

      - name: Lint desktop application
        run: pnpm lint

      - name: Test application behavior
        run: node --test tests/ai-presentation.test.mjs tests/agent-refinements.test.mjs tests/clients-store.test.mjs tests/customizing-response.test.mjs tests/ef-drive.test.mjs tests/sap-control.test.mjs tests/haiku-router.test.mjs tests/catalog-bundle.test.mjs tests/local-features.test.mjs tests/context-compaction.test.mjs tests/local-search-ui.test.mjs tests/image-attachments.test.mjs

      - name: Fetch administrator-published SAP catalog
        if: matrix.artifact == 'windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CATALOG_BUNDLE_TAG: ${{ vars.CATALOG_BUNDLE_TAG }}
          CATALOG_BUNDLE_SHA256: ${{ vars.CATALOG_BUNDLE_SHA256 }}
        run: |
          if (-not $env:CATALOG_BUNDLE_TAG -or $env:CATALOG_BUNDLE_SHA256 -notmatch '^[a-fA-F0-9]{64}$') { throw 'Configure CATALOG_BUNDLE_TAG e CATALOG_BUNDLE_SHA256 com o pacote preparado pelo administrador.' }
          New-Item -ItemType Directory -Force tmp/catalog | Out-Null
          gh release download $env:CATALOG_BUNDLE_TAG --repo $env:GITHUB_REPOSITORY --pattern catalog-local-search.zip --dir tmp/catalog
          if ($LASTEXITCODE -ne 0) { throw 'Não foi possível baixar o catálogo publicado.' }
          $archive = (Resolve-Path -LiteralPath tmp/catalog/catalog-local-search.zip).Path
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $env:CATALOG_BUNDLE_SHA256) { throw 'Checksum do pacote de catálogo divergente.' }
          $destination = [IO.Path]::GetFullPath((Join-Path (Get-Location) resources/local-search))
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead($archive)
          try {
            foreach ($entry in $zip.Entries) {
              $resolved = [IO.Path]::GetFullPath((Join-Path $destination $entry.FullName))
              if (-not $resolved.StartsWith($destination + [IO.Path]::DirectorySeparatorChar, [StringComparison]::OrdinalIgnoreCase)) { throw 'Arquivo fora do pacote de catálogo.' }
            }
          } finally { $zip.Dispose() }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination

      - name: Build renderer/main
        run: pnpm build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Build installers
        run: pnpm exec electron-builder ${{ matrix.build-flag }} --publish never

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact }}
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/*.dmg
            dist/*.dmg.blockmap
            dist/*.zip
            dist/*.zip.blockmap
            dist/*.AppImage
            dist/latest*.yml
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets

      - name: Check required installers
        run: |
          test -f release-assets/release-windows/latest.yml
          test -f release-assets/release-macos/latest-mac.yml
          test -f release-assets/release-linux/latest-linux.yml
          compgen -G 'release-assets/release-windows/*.exe'
          compgen -G 'release-assets/release-macos/*.dmg'
          compgen -G 'release-assets/release-macos/*.zip'
          compgen -G 'release-assets/release-linux/*.AppImage'

      - name: Prepare release notes
        run: |
          awk -v heading="## [${GITHUB_REF_NAME#v}]" '
            index($0, heading) == 1 { in_section = 1; print; next }
            in_section && /^## \[/ { exit }
            in_section { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Publish one GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-assets/release-windows/*.exe \
            release-assets/release-windows/*.exe.blockmap \
            release-assets/release-windows/latest.yml \
            release-assets/release-macos/*.dmg \
            release-assets/release-macos/*.dmg.blockmap \
            release-assets/release-macos/*.zip \
            release-assets/release-macos/*.zip.blockmap \
            release-assets/release-macos/latest-mac.yml \
            release-assets/release-linux/*.AppImage \
            release-assets/release-linux/latest-linux.yml \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Abapfy $GITHUB_REF_NAME" \
            --notes-file release-notes.md
