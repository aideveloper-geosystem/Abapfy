appId: com.abapfy.app
productName: Abapfy
directories:
  buildResources: build
files:
  - out/**
  - package.json
  - resources/**
  - '!resources/local-search*/**'
  - '!resources/.catalog-stage-*/**'
  - '!resources/catalog-local-search.zip'
  - '!node_modules/**'
asarUnpack:
  - resources/**
win:
  extraResources:
    - from: resources/local-search
      to: local-search
      filter:
        - '**/*'
  executableName: abapfy
  icon: resources/abapfy-horizon-mark.png
  target:
    - target: nsis
      arch:
        - x64
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: false
  allowToChangeInstallationDirectory: true
  include: build/installer.nsh
mac:
  icon: resources/abapfy-horizon-mark.png
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  icon: build/horizon-icons
  target:
    - AppImage
  category: Development
npmRebuild: false
beforePack: build/validate-catalog-bundle.cjs
publish:
  provider: github
  owner: aideveloper-geosystem
  repo: Abapfy
  releaseType: release
